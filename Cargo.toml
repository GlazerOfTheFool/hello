[package]
name = "media-downloader"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
rfd = "0.15"
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
arboard = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
